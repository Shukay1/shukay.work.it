<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Каталог смартфонов — Tunduk Phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap">
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--panel:#15171a;--raised:#1d2024;--edge:#2b2e32;--fg:#f7f7f0;--muted:#a8acb1;--lime:#d8fa4f;--on-accent:#161907;--head:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light;--bg:#f2f3eb;--panel:#fff;--raised:#e9ebdf;--edge:#d4d8c8;--fg:#171a13;--muted:#5d6254;--lime:#4d6400;--on-accent:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{width:min(1230px,calc(100% - 68px));margin-inline:auto}
.top{border-bottom:1px solid var(--edge)}.top-inner{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}.logo{width:47px;height:47px;object-fit:cover;border:1px solid var(--edge);border-radius:2px}.bar{display:flex;gap:25px;color:var(--muted);font-weight:700}.bar a:hover,.footer a:hover{color:var(--lime)}.contacts,.actions,.hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flag{width:26px;border-radius:2px}
.btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--edge);border-radius:2px;background:var(--panel);color:var(--fg);font-weight:800;white-space:nowrap}.btn:hover{border-color:var(--lime)}.primary{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}.primary:hover{filter:brightness(1.08)}.theme{font-size:17px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;min-height:clamp(412px,43vw,568px);border-bottom:1px solid #2b2e32;background:#101214;color:#f7f7f0}.hero-image{position:absolute;z-index:-2;inset:0 0 0 auto;width:64%;height:100%;object-fit:contain;object-position:center;filter:saturate(.65);background:#3a0810}.hero::before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#08090bf9 5%,#08090bf0 32%,#08090b44 73%),linear-gradient(0deg,#08090bde,transparent 42%)}.hero-copy{padding-block:48px}.kicker{display:flex;align-items:center;gap:9px;color:var(--lime);font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.kicker::before{content:"";width:15px;height:2px;background:currentColor}.hero .kicker,.hero h1 span{color:#d8fa4f}.hero h1{font:800 clamp(78px,10vw,155px)/.82 var(--head);text-transform:uppercase;letter-spacing:-.025em;margin:12px 0 18px}.hero h1 span{display:block;font-size:.60em;letter-spacing:.015em}.hero-copy>p:not(.kicker){color:#dedfda;font-size:16px;max-width:285px}.hero-actions{margin-top:20px}.hero .primary{background:#d8fa4f;color:#161907;border-color:#d8fa4f}.hero .btn:not(.primary){background:#131518d0;border-color:#ffffff50;color:#fff}
.catalog{padding-block:48px 60px;scroll-margin-top:15px}.intro{margin-bottom:17px}.intro h2{font:800 clamp(44px,7vw,78px)/.94 var(--head);text-transform:uppercase;letter-spacing:-.015em;margin-top:6px}
.series{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.series button{display:flex;align-items:center;gap:7px;padding:7px 13px;min-height:40px;background:var(--panel);border:1px solid var(--edge);color:var(--fg);font-weight:750}.series button:hover{border-color:var(--lime)}.series button[aria-pressed=true]{background:var(--lime);color:var(--on-accent);border-color:var(--lime)}.series img{width:19px;height:25px;object-fit:contain}
.listing{display:grid;grid-template-columns:216px minmax(0,1fr);gap:15px}.sidebar{align-self:start;border:1px solid var(--edge);background:var(--panel);padding:14px}.sidebar summary{font-weight:850;cursor:pointer}.group{border-top:1px solid var(--edge);margin-top:11px;padding-top:9px}.group h3{margin-bottom:6px;font-size:13px}.choices{display:grid;gap:5px;color:var(--muted)}.choices label{display:flex;align-items:center;gap:6px}.choices input{accent-color:var(--lime)}.range{display:grid;grid-template-columns:1fr 1fr;gap:5px}.range input,.toolbar select{color:var(--fg);background:var(--bg);border:1px solid var(--edge);min-width:0;padding:7px}.reset{margin-top:12px;padding:0;background:none;border:0;color:var(--lime);font-weight:750}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:9px;color:var(--muted);font-size:13px}.toolbar select{max-width:100%}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{border:1px solid var(--edge);background:var(--panel);display:flex;flex-direction:column;min-width:0}.card:hover{border-color:var(--lime)}.pic{aspect-ratio:1.18;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--raised);border-bottom:1px solid var(--edge)}.pic img{position:absolute;inset:0;width:100%;height:100%;padding:8px;object-fit:contain}.label{position:absolute;top:8px;left:8px;background:#101115;color:#d8fa4f;padding:4px 6px;font-size:11px;font-weight:800}.info{display:flex;flex-direction:column;flex:1;padding:12px;gap:6px}.price{color:var(--lime);font:800 30px/.95 var(--head);white-space:nowrap}.info h3{font:750 22px/1 var(--head);text-transform:uppercase;overflow-wrap:anywhere}.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-block:3px}.spec{background:var(--raised);padding:4px 1px;text-align:center;font-size:11px;font-weight:750;white-space:nowrap}.spec small{display:block;color:var(--muted);font-size:9px;font-weight:500}.info .btn{width:100%;margin-top:auto;font-size:11px;padding:6px 3px;min-height:34px}.empty{grid-column:1/-1;padding:14px;background:var(--panel);color:var(--muted)}.no-photo{color:var(--muted)}
.footer{border-top:1px solid var(--edge);background:var(--panel);padding:18px 0 24px;color:var(--muted)}.footer .wrap,.links{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
dialog{max-width:calc(100% - 22px);width:440px;background:var(--panel);color:var(--fg);border:1px solid var(--edge);padding:16px}dialog::backdrop{background:#000c}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:9px}.close{background:var(--raised);color:var(--fg);border:1px solid var(--edge);font-size:23px;width:38px;height:38px}.dialog-info{margin-block:12px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:930px){.wrap{width:calc(100% - 38px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.listing{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:650px){.wrap{width:calc(100% - 24px)}.top-inner{min-height:62px;gap:6px}.brand{font-size:11px;letter-spacing:.06em;gap:5px}.logo{width:33px;height:33px}.bar,.small-flag,.contacts>a:not(.primary){display:none}.contacts{gap:4px}.contacts .btn{min-height:35px;padding:4px 6px;font-size:11px}.hero{min-height:432px;align-items:end}.hero-image{width:100%;height:88%;object-position:60% 0}.hero::before{background:linear-gradient(0deg,#08090bf9 6%,#08090be6 22%,#08090b84 55%,#08090b05 92%)}.hero-copy{padding-block:24px}.hero h1{font-size:clamp(65px,16vw,98px)}.hero-copy>p:not(.kicker){font-size:14px}.catalog{padding-block:28px 37px}.listing{grid-template-columns:1fr;gap:10px}.series{flex-wrap:nowrap;overflow:auto;padding-bottom:4px}.series button{flex:none;white-space:nowrap}.grid{gap:6px}.info{padding:7px;gap:5px}.price{font-size:24px}.info h3{font-size:19px}.spec{font-size:10px}.spec small{font-size:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

const maxListings = 25;
let products = JSON.parse(document.getElementById('catalog-data').textContent);
products = products.slice(0,maxListings).map((product,id)=>({...product,id}));
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' сом';
const specs=p=>[[p.memory===1024?'1 ТБ':p.memory?p.memory+' ГБ':'—','Память'],[p.battery==null?'—':p.battery+'%','АКБ'],[p.cycles??'—','Циклы']];
const escapeHTML=value=>String(value).replace(/[&<>"']/g, character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const productPhoto=p=>Number.isInteger(p.photo)?photos[p.photo]:/^https:\/\//i.test(p.photo||'')||/^\/catalog-photo\/[a-f0-9]{64}\.webp$/.test(p.photo||'')?escapeHTML(p.photo):'';
const modelLabel=p=>escapeHTML(p.model);
let models;
const selected=new Set();
function refreshModels(){
 models=[...new Set(products.map(p=>p.model))];
 for(const model of selected)if(!models.includes(model))selected.delete(model);
 $('series').innerHTML=['Все',...models].map((m,i)=>{
   const photo=i?productPhoto(products.find(p=>p.model===m)):'';
   return `<button type="button" data-series="${i-1}" aria-pressed="false">${photo?`<img src="${photo}" alt="">`:''}<span>${escapeHTML(m)}</span></button>`;
 }).join('');
 $('models').innerHTML=models.map((m,i)=>`<label><input type="checkbox" data-model="${i}">${escapeHTML(m)}</label>`).join('');
}
refreshModels();
if(matchMedia('(max-width:650px)').matches)$('sidebar').open=false;
function render(){
 const min=$('min').value===''?0:Number($('min').value);
 const max=$('max').value===''?Infinity:Number($('max').value);
 const memory=[...document.querySelectorAll('[data-memory]:checked')].map(el=>Number(el.dataset.memory));
 const view=products.filter(p=>(!selected.size||selected.has(p.model))&&p.price>=min&&p.price<=max&&(!memory.length||memory.includes(p.memory))&&(!$('battery').checked||p.battery>=80));
 const order=$('sort').value;
 if(order!=='default')view.sort((a,b)=>order==='asc'?a.price-b.price:b.price-a.price);
 for(const b of $('series').children){const i=Number(b.dataset.series);b.setAttribute('aria-pressed',String(i===-1?!selected.size:selected.size===1&&selected.has(models[i])))}
 for(const el of document.querySelectorAll('[data-model]'))el.checked=selected.has(models[Number(el.dataset.model)]);
 $('count').textContent='Найдено: '+view.length;
 $('products').innerHTML=view.length?view.map(p=>`<article class="card"><div class="pic">${productPhoto(p)?`<img src="${productPhoto(p)}" alt="Иллюстрация ${modelLabel(p)}" loading="lazy">`:'<span class="no-photo">Фото по запросу</span>'}${p.badge?`<span class="label">${escapeHTML(p.badge)}</span>`:''}</div><div class="info"><strong class="price">${money(p.price)}</strong><h3>${modelLabel(p)}</h3><div class="specs">${specs(p).map(([v,k])=>`<div class="spec">${v}<small>${k}</small></div>`).join('')}</div><button class="btn" type="button" data-product="${p.id}">Уточнить наличие ↗</button></div></article>`).join(''):'<p class="empty">По этим условиям ничего не найдено.</p>';
}
for(const id of ['min','max'])$(id).addEventListener('input',render);
$('sort').addEventListener('change',render);
$('sidebar').addEventListener('change',e=>{if(e.target.hasAttribute('data-model')){const m=models[Number(e.target.dataset.model)];if(e.target.checked)selected.add(m);else selected.delete(m)}render()});
$('reset').addEventListener('click',()=>{selected.clear();$('min').value=$('max').value='';for(const el of $('sidebar').querySelectorAll('input[type=checkbox]'))el.checked=false;render()});
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-series]');
 if(s){selected.clear();const i=Number(s.dataset.series);if(i>=0)selected.add(models[i]);render();return}
 const b=e.target.closest('[data-product]');if(!b)return;
 const p=products[Number(b.dataset.product)];
 const description=[...specs(p).filter(([v])=>v!=='—').map(([v,k])=>k+' '+v),p.badge,money(p.price)].filter(Boolean).join(' · ');
 $('dialog-title').textContent=p.model;
 $('dialog-info').textContent=description;
 $('write').href='https://wa.me/996990150304?text='+encodeURIComponent('Здравствуйте! Есть ли в наличии '+p.model+' ('+description+')?');
 $('dialog').showModal();
});
render();


let savedTheme;
try { savedTheme=localStorage.getItem('tunduk-theme'); } catch {}
function applyTheme(theme){
 document.documentElement.dataset.theme=theme;
 const dark=theme==='dark';
 $('theme').textContent=dark?'☀':'☾';
 $('theme').setAttribute('aria-label',dark?'Светлая тема':'Тёмная тема');
 $('theme').title=$('theme').getAttribute('aria-label');
 document.querySelector('[name="theme-color"]').content=dark?'#0c0d0f':'#f2f3eb';
}
applyTheme(savedTheme==='light'?'light':'dark');

$('theme').addEventListener('click',()=>{
 savedTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';
 applyTheme(savedTheme);
 try { localStorage.setItem('tunduk-theme',savedTheme); } catch {}
});

</script>
</body>
